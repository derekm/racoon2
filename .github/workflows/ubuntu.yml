# Ubuntu CI Build & Test for racoon2.
# Three build jobs share the same unit suite:
#   - build-xfrm: NETLINK_XFRM (the Linux default). On success this
#     triggers the live integration matrix (integration.yml).
#   - build-pfkey: the Linux pfkey compat socket, build + unit suite.
#     Linux pfkey is lossy (drops kernel->user datagrams on rcvbuf fill),
#     so the full matrix does not run against it; a small live subset
#     does (integration.yml pfkey-live: the hmac_sha2_256 refusal and
#     real af_key SAs with exact ICV lengths).
#   - build-asan: NETLINK_XFRM under ASan+UBSan, plus one-datagram
#     pre-auth negative tests against the sanitized iked.
# Same unit suite as netbsd.yml on both backends.

name: Ubuntu build & test

on:
  push:
    branches: [linux-km, int/gsoc2026]
  pull_request:
    branches: [linux-km, int/gsoc2026]
  workflow_dispatch:
  # nightly: 07:17 UTC = 02:17 CDT / 01:17 CST (America/Chicago)
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

jobs:
  build-xfrm:
    name: 'Ubuntu NETLINK_XFRM build (default KM)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config gcc make \
            libssl-dev libkrb5-dev libpcap-dev bison flex

      - name: Bootstrap
        run: autoreconf -fi

      - name: Configure
        run: ./configure --prefix=/usr/local/racoon2

      - name: Build
        run: make -j2

      - name: 'Unit suite (lib: make check)'
        run: make -C lib check

      - name: 'Unit suite (iked: full configured TESTS, incl. resumetest fragtest cfgwalktest)'
        run: make -C iked check

      - name: 'Generate compliance report (KAT evidence from this build)'
        run: bash samples/linux-matrix/ci-comply-report.sh "$GITHUB_WORKSPACE/${{ github.job }}-compliance.md" iked/ndcppkats.log iked/test-suite.log lib/test-suite.log

      - name: 'Upload compliance report artifact'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-${{ github.job }}
          path: ${{ github.job }}-compliance.md
          overwrite: true
          if-no-files-found: error

      - name: 'Dump unit logs on failure'
        if: failure()
        run: |
          for f in iked/test-suite.log iked/eaytest.log iked/evlooptest.log iked/workerstest.log; do
            if [ -f "$f" ]; then echo "== $f =="; cat "$f"; fi
          done

  openssl-canary:
    name: 'OpenSSL deprecation canary (distro + OpenSSL master headers)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config gcc make \
            libssl-dev libkrb5-dev libpcap-dev bison flex perl git

      - name: Configure (config.h only)
        run: autoreconf -fi && ./configure --prefix=/usr/local/racoon2 >/dev/null

      - name: 'Canary vs distro OpenSSL (gating on the clean list)'
        run: sh samples/ci/openssl-canary.sh .

      - name: Generate OpenSSL master headers
        run: |
          git clone -q --depth 1 https://github.com/openssl/openssl.git /tmp/ossl
          cd /tmp/ossl && ./Configure no-tests >/dev/null && make -s build_generated >/dev/null
          echo "OpenSSL master: $(git -C /tmp/ossl log -1 --format='%h %cs')"

      - name: 'Canary vs OpenSSL master (tracker, not gating)'
        continue-on-error: true
        run: OPENSSL_CFLAGS="-I/tmp/ossl/include" sh samples/ci/openssl-canary.sh .

  fuzz-smoke:
    name: 'libFuzzer smoke (IKEv2 payload chain, IKEv1 pre-auth parsers)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config clang make \
            libssl-dev libkrb5-dev libpcap-dev bison flex

      - name: ASan-compatible mmap randomisation
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build with libFuzzer instrumentation
        run: |
          autoreconf -fi
          ./configure --prefix=/usr/local/racoon2 --enable-fuzz CC=clang \
            CFLAGS="-O1 -g -fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=undefined" \
            LDFLAGS="-fsanitize=address,undefined" >/dev/null
          make -j"$(nproc)" >/dev/null

      # Bounded smoke, not a campaign: 120 s per harness from the checked-in
      # seed corpus.  Any crash, sanitizer report, leak or timeout fails the
      # job and the reproducer is uploaded.
      - name: Fuzz each harness for 120 s
        run: |
          set -eo pipefail
          mkdir -p /tmp/fuzz-out
          for t in ikev2_payloads:ikev2 ikev1_parse:ikev1; do
            b=${t%%:*}; c=${t##*:}
            mkdir -p /tmp/fuzz-out/corpus-$c
            cp iked/fuzz/corpus/$c/* /tmp/fuzz-out/corpus-$c/
            ./iked/fuzz_$b -max_total_time=120 -max_len=4096 -timeout=10 \
              -artifact_prefix=/tmp/fuzz-out/$b- -print_final_stats=1 \
              /tmp/fuzz-out/corpus-$c 2>&1 | tail -15
          done

      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducers
          path: /tmp/fuzz-out/*-*
          if-no-files-found: warn

  build-pfkey:
    name: 'Ubuntu pfkey compat build (sanity only)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config gcc make \
            libssl-dev libkrb5-dev libpcap-dev bison flex

      - name: Bootstrap
        run: autoreconf -fi

      - name: Configure
        run: ./configure --prefix=/usr/local/racoon2 --with-km-backend=pfkey

      - name: Build
        run: make -j2

      - name: 'Unit suite (lib: make check)'
        run: make -C lib check

      - name: 'Unit suite (iked: full configured TESTS, incl. resumetest fragtest cfgwalktest)'
        run: make -C iked check

      - name: 'Generate compliance report (KAT evidence from this build)'
        run: bash samples/linux-matrix/ci-comply-report.sh "$GITHUB_WORKSPACE/${{ github.job }}-compliance.md" iked/ndcppkats.log iked/test-suite.log lib/test-suite.log

      - name: 'Upload compliance report artifact'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-${{ github.job }}
          path: ${{ github.job }}-compliance.md
          overwrite: true
          if-no-files-found: error

      - name: 'Dump unit logs on failure'
        if: failure()
        run: |
          for f in iked/test-suite.log iked/eaytest.log iked/evlooptest.log iked/workerstest.log; do
            if [ -f "$f" ]; then echo "== $f =="; cat "$f"; fi
          done

  build-asan:
    name: 'Ubuntu ASan+UBSan build (unit suite + pre-auth one-datagram negatives)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config gcc make \
            libssl-dev libkrb5-dev libpcap-dev bison flex python3

      # gcc's ASan runtime cannot map its shadow with the 32-bit mmap
      # randomisation of current runner kernels (random DEADLYSIGNAL at
      # start-up); 28 bits is the value ASan supports.
      - name: ASan-compatible mmap randomisation
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Bootstrap
        run: autoreconf -fi

      - name: Configure (ASan + UBSan, UBSan errors fatal)
        run: |
          ./configure --prefix=/usr/local/racoon2 \
            CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined" \
            LDFLAGS="-fsanitize=address,undefined"

      - name: Build
        run: make -j2

      - name: 'Unit suite under ASan/UBSan (lib)'
        run: make -C lib check

      - name: 'Unit suite under ASan/UBSan (iked)'
        run: make -C iked check

      # F1 (zero-length NAT_DETECTION notify in IKE_SA_INIT) and F2 (IKEv1
      # header announcing a fragment with no fragment header): one
      # unauthenticated datagram each against a fresh ASan iked; iked must
      # survive, log the guard and leave no sanitizer report.
      - name: 'Pre-auth one-datagram negatives (F1, F2) against ASan iked'
        run: sudo bash samples/linux-matrix/tools/preauth_oneshot.sh .

      # A subset of LIVE matrix rows against the sanitized daemons: real
      # IKE_SA_INIT/IKE_AUTH/CREATE_CHILD_SA, NAT-T rebinding (XFRM
      # MAPPING) and the netlink ENOBUFS resync, where the parsers and the
      # new lib/if_xfrm.c paths see real traffic.  Any sanitizer report
      # (ASan aborts the daemon; the report lands in /tmp/r2-asan) fails.
      - name: 'Live rows against the ASan/UBSan daemons'
        run: |
          set -o pipefail
          sudo apt-get install -y -qq strongswan iproute2 iputils-ping xxd iptables conntrack
          sudo make install >/dev/null
          # the rows' shared PSK / spmd password (no live daemon config)
          E=/usr/local/racoon2/etc/racoon2
          sudo mkdir -p "$E/psk"
          printf 'racoon2-ci-psk-0123456789abcdef' | sudo tee "$E/psk/macos.psk" >/dev/null
          printf 'racoon2-ci-pwd\n' | sudo tee "$E/spmd.pwd" >/dev/null
          sudo chmod 600 "$E/psk/macos.psk" "$E/spmd.pwd"
          sudo rm -rf /tmp/r2-asan && sudo mkdir -p /tmp/r2-asan
          sudo -E bash samples/linux-matrix/run.sh --src "$GITHUB_WORKSPACE" \
            --cases '^(i2iinit-ike-cbc128|i2iinit-ike-cbc128-esp-sha384|i2inatt-rebind|i2inatt-xfrmflood|icvaudit-ok) ' \
            | tee /tmp/r2-asan-matrix.log
          if ls /tmp/r2-asan/asan.* >/dev/null 2>&1; then
            echo "FAIL: sanitizer report(s) from live daemons:"; sudo cat /tmp/r2-asan/asan.*; exit 1
          fi
          echo "no sanitizer report from the live rows"
        env:
          R2_PREFIX: /usr/local/racoon2
          R2_REQUIRE_LIVE: 1
          R2_LANE: ubuntu
          R2_MIN_PASS: 5
          ASAN_OPTIONS: log_path=/tmp/r2-asan/asan:detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: log_path=/tmp/r2-asan/asan:print_stacktrace=1:halt_on_error=1

      - name: 'Dump unit logs on failure'
        if: failure()
        run: |
          for f in lib/test-suite.log iked/test-suite.log; do
            if [ -f "$f" ]; then echo "== $f =="; cat "$f"; fi
          done

  integration:
    name: 'Integration (live matrix, xfrm)'
    needs: build-xfrm
    uses: ./.github/workflows/integration.yml
    with:
      os: linux
      dist: linux
