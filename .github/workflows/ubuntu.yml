# Ubuntu CI Build & Test for racoon2.
# Sister of netbsd.yml: the SAME unit suite on Linux, built with both KM
# backends — NETLINK_XFRM (the Linux default) and the pfkey compat socket
# (--with-km-backend=pfkey) — validating xfrm and pfkey in one workflow.
#
# All tests here are unprivileged userspace; no kernel/tunnel cases yet.

name: Ubuntu build & test

on:
  push:
    branches: [linux-km]
  pull_request:
    branches: [linux-km]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: 'Ubuntu ${{ matrix.km }} KM backend'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        km: [xfrm, pfkey]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config gcc make \
            libssl-dev libkrb5-dev libpcap-dev bison flex

      - name: Bootstrap
        run: autoreconf -fi

      - name: Configure
        run: ./configure --prefix=/usr/local/racoon2 --with-km-backend=${{ matrix.km }}

      - name: Build
        run: make -j2

      - name: 'Unit suite (lib: kmtest; sample is broken upstream)'
        run: |
          make -C lib kmtest
          ./lib/kmtest

      - name: 'Unit suite (iked: eaytest evlooptest workerstest)'
        run: make -C iked check TESTS="eaytest evlooptest workerstest"
