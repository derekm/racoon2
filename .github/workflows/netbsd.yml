# NetBSD CI Build & Test for racoon2.
# NetBSD 10.1 build/test/smoke via vmactions/netbsd-vm (same accelerator as
# the 10.2/11.0 legs — replaces the slow cross-platform-actions QEMU job that
# intermittently hung on the plain-QEMU boot).  Units + make install + rc.d
# smoke (spmd/iked onestart, UDP 500).
# Not a tunnel matrix: no Linux netns; npf/pf/ipf is packet filter, not
# SAD/SPD (that is setkey/PF_KEY). Do not wrap linux-matrix here.
#
# The build/test body lives in samples/netbsd-ci/netbsd-vmactions-build.sh
# (shared by all three NetBSD legs so they test the same thing).

name: NetBSD build & test

on:
  push:
    branches: [linux-km, int/gsoc2026]
  pull_request:
    branches: [linux-km, int/gsoc2026]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netbsd-build-test:
    name: 'NetBSD 10.1 build & test (pfkey KM) [vmactions]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test on NetBSD 10.1
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          mem: 4096
          cpu: 2
          run: |
            set -eu
            sh samples/netbsd-ci/netbsd-vmactions-build.sh

      - name: 'Generate compliance report (KAT evidence from NetBSD 10.1 build)'
        run: bash samples/linux-matrix/ci-comply-report.sh "$GITHUB_WORKSPACE/netbsd-build-test-101-compliance.md" iked/ndcppkats.log iked/test-suite.log lib/test-suite.log
        working-directory: ${{ runner.workspace }}/racoon2

      - name: 'Upload compliance report artifact'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-netbsd-build-test-101
          path: netbsd-build-test-101-compliance.md
          overwrite: true
          if-no-files-found: error

  netbsd-build-test-vm102:
    name: 'NetBSD 10.2 build & test (pfkey KM) [vmactions]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test on NetBSD 10.2
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.2"
          mem: 4096
          cpu: 2
          run: |
            set -eu
            sh samples/netbsd-ci/netbsd-vmactions-build.sh

      - name: 'Generate compliance report (KAT evidence from NetBSD 10.2 build)'
        run: bash samples/linux-matrix/ci-comply-report.sh "$GITHUB_WORKSPACE/netbsd-build-test-102-compliance.md" iked/ndcppkats.log iked/test-suite.log lib/test-suite.log
        working-directory: ${{ runner.workspace }}/racoon2

      - name: 'Upload compliance report artifact'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-netbsd-build-test-102
          path: netbsd-build-test-102-compliance.md
          overwrite: true
          if-no-files-found: error

  netbsd-build-test-vm11:
    name: 'NetBSD 11.0 build & test (pfkey KM) [vmactions]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test on NetBSD 11.0
        uses: vmactions/netbsd-vm@v1
        with:
          release: "11.0"
          mem: 4096
          cpu: 2
          run: |
            set -eu
            sh samples/netbsd-ci/netbsd-vmactions-build.sh

      - name: 'Generate compliance report (KAT evidence from NetBSD 11.0 build)'
        run: bash samples/linux-matrix/ci-comply-report.sh "$GITHUB_WORKSPACE/netbsd-build-test-11-compliance.md" iked/ndcppkats.log iked/test-suite.log lib/test-suite.log
        working-directory: ${{ runner.workspace }}/racoon2

      - name: 'Upload compliance report artifact'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-netbsd-build-test-11
          path: netbsd-build-test-11-compliance.md
          overwrite: true
          if-no-files-found: error

