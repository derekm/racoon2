# NetBSD CI Build & Test for racoon2.
# NetBSD 10.1 QEMU (cross-platform-actions): pfkey KM default.
# Units + make install + rc.d smoke (spmd/iked onestart, UDP 500).
# Not a tunnel matrix: no Linux netns; npf/pf/ipf is packet filter, not
# SAD/SPD (that is setkey/PF_KEY). Do not wrap linux-matrix here.
#
# Dependencies (via pkgin): autoconf automake libtool pkgconf gmake m4 bison.
# Base system provides cc (gcc), flex, openssl, krb5 headers.

name: NetBSD build & test

on:
  push:
    branches: [linux-km, int/gsoc2026]
  pull_request:
    branches: [linux-km, int/gsoc2026]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netbsd-build-test:
    name: 'NetBSD 10.1 build & test (pfkey KM)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test on NetBSD 10
        uses: cross-platform-actions/action@v0.27.0
        with:
          operating_system: netbsd
          architecture: x86_64
          version: '10.1'
          shell: bash
          memory: 4096
          cpu_count: 2
          run: |
            set -euo pipefail

            echo "=== Syncing package repository ==="
            sudo pkgin -y update

            echo "=== Installing build dependencies ==="
            sudo pkgin -y install autoconf automake libtool pkgconf gmake m4 bison

            # Sanitizer: ASan/UBSan on by default (this VM's toolchain is
            # NetBSD's own gcc — sanitizers here are the non-Linux check).
            export SAN_CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
            export SAN_LDFLAGS="-fsanitize=address,undefined"
            export CC=cc

            echo "=== Bootstrapping build system ==="
            autoreconf -fi

            echo "=== Configure ==="
            CFLAGS="-g -O2 ${SAN_CFLAGS}" \
            LDFLAGS="${SAN_LDFLAGS}" \
            ./configure --prefix=/usr/local/racoon2

            echo "=== Building ==="
            make -j2

            echo "=== Unit suite (lib: make check) ==="
            make -C lib check

            echo "=== Unit suite (iked: eaytest evlooptest workerstest ndcppkats) ==="
            make -C iked check TESTS="eaytest evlooptest workerstest ndcppkats"

            echo "=== make install (sanitized, for the unit-test build only) ==="
            sudo make install
            test -x /usr/local/racoon2/sbin/iked
            test -x /usr/local/racoon2/etc/racoon2/rc.d/iked
            test -x /usr/local/racoon2/etc/racoon2/rc.d/spmd

            echo "=== REBUILD non-sanitized daemons for the rc.d smoke ==="
            # The unit suites above already ran the ASan/UBSan check.  The
            # boot smoke (rc.d + PF_KEY + UDP/500) must run PRODUCTION-shaped
            # binaries: ASan breaks OpenSSL 3.0's provider-based sha256 EVP
            # ops on this toolchain (EVP_DigestInit_ex fails with an empty
            # ERR even for a plain EVP_sha256()/HMAC probe linked only
            # against /usr/lib/libcrypto.a), which makes spmd's keyed
            # HMAC-SHA256 SPMIF login fail at challenge generation.  sha1
            # survives only via OpenSSL's legacy path.  Non-sanitized build
            # is the real deployment shape — proven working by the same probe
            # (sha1/sha256/byname/HMAC all OK without -fsanitize).
            make clean >/dev/null
            SAN_CFLAGS= SAN_LDFLAGS= \
            CFLAGS="-g -O2" \
            ./configure --prefix=/usr/local/racoon2 >/dev/null
            make -j2 >/dev/null
            sudo make install
            # Re-run the unit/KAT suites on the production-shaped build so the
            # compliance report has evidence again (make clean removed the
            # sanitized-run logs; these non-sanitized results are the more
            # representative cells anyway).
            make -C lib check
            make -C iked check TESTS="eaytest evlooptest workerstest ndcppkats"

            echo "=== rc.d smoke (spmd then iked, UDP 500, PF_KEY) ==="
            # ASan daemons: no leak-abort on orderly stop. NetBSD gcc ASan
            # refuses to exec under ASLR ("This sanitizer is not compatible
            # with enabled ASLR") — drop it for the smoke only.
            export ASAN_OPTIONS="${ASAN_OPTIONS:-detect_leaks=0}"
            sudo sysctl -w security.pax.aslr.global=0 || true
            sudo sysctl -w security.pax.aslr.enabled=0 || true
            sudo -E env PREFIX=/usr/local/racoon2 SRC="$PWD" ASAN_OPTIONS="$ASAN_OPTIONS" \
              sh samples/netbsd-ci/rc-smoke.sh
      - name: 'Generate compliance report (KAT evidence from NetBSD build)'
        run: bash samples/linux-matrix/ci-comply-report.sh "$GITHUB_WORKSPACE/netbsd-build-test-compliance.md" iked/ndcppkats.log iked/test-suite.log lib/test-suite.log
        working-directory: ${{ runner.workspace }}/racoon2

      - name: 'Upload compliance report artifact'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-netbsd-build-test
          path: netbsd-build-test-compliance.md
          overwrite: true
          if-no-files-found: error

  netbsd-build-test-vm102:
    name: 'NetBSD 10.2 build & test (pfkey KM) [vmactions]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test on NetBSD 10.2
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.2"
          mem: 4096
          cpu: 2
          run: |
            set -eu
            sh samples/netbsd-ci/netbsd-vmactions-build.sh

      - name: 'Generate compliance report (KAT evidence from NetBSD 10.2 build)'
        run: bash samples/linux-matrix/ci-comply-report.sh "$GITHUB_WORKSPACE/netbsd-build-test-102-compliance.md" iked/ndcppkats.log iked/test-suite.log lib/test-suite.log
        working-directory: ${{ runner.workspace }}/racoon2

      - name: 'Upload compliance report artifact'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-netbsd-build-test-102
          path: netbsd-build-test-102-compliance.md
          overwrite: true
          if-no-files-found: error

  netbsd-build-test-vm11:
    name: 'NetBSD 11.0 build & test (pfkey KM) [vmactions]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test on NetBSD 11.0
        uses: vmactions/netbsd-vm@v1
        with:
          release: "11.0"
          mem: 4096
          cpu: 2
          run: |
            set -eu
            sh samples/netbsd-ci/netbsd-vmactions-build.sh

      - name: 'Generate compliance report (KAT evidence from NetBSD 11.0 build)'
        run: bash samples/linux-matrix/ci-comply-report.sh "$GITHUB_WORKSPACE/netbsd-build-test-11-compliance.md" iked/ndcppkats.log iked/test-suite.log lib/test-suite.log
        working-directory: ${{ runner.workspace }}/racoon2

      - name: 'Upload compliance report artifact'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-netbsd-build-test-11
          path: netbsd-build-test-11-compliance.md
          overwrite: true
          if-no-files-found: error

