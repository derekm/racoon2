# FreeBSD CI Build, Unit/KAT, and FIRST BSD TUNNEL CONFORMANCE for racoon2.
# FreeBSD 15.1 via vmactions/freebsd-vm (the FreeBSD analogue of the
# netbsd-vm legs).  FreeBSD auto-selects the pfkey KM backend (if_pfkeyv2.c)
# so this is the real BSD PF_KEY SAD/SPD path, and 15.1 base OpenSSL 3.5.6
# turns WITH_ADDKE on (Fedora-44 parity for the RFC 9370 PQC units).
#
# The vnet conformance (freebsd-vnet-matrix.sh) is NEW vs the NetBSD legs:
# NetBSD is smoke-only ("no netns; npf/pf/ipf is packet filter, not
# SAD/SPD"), whereas FreeBSD HAS virtual networking (vnet jails + epair(4))
# so we can isolate two iked seats and run a real ESP tunnel through the
# pfkey KM -- setkey -D evidence in the kernel SADB.
#
# The matrix is sharded exactly like the Fedora/Ubuntu matrices
# (integration.yml linux-matrix / fedora-pqc-matrix): M shards, each its own
# GitHub job (own VM, so jail names / epair / /tmp/freeb never collide across
# jobs), running rows whose dispatcher index % M == K via
# freebsd-vnet-matrix.sh --shard K M.  A report job merges the per-shard
# logs, tallies PASS/FAIL, and fails the workflow if any monitored row FAIL.
#
# Body lives in samples/freebsd-ci/ (build = build+units; then the vnet leg).

name: FreeBSD build & test (pfkey KM + vnet conformance)

on:
  push:
    branches: [linux-km, int/gsoc2026]
  pull_request:
    branches: [linux-km, int/gsoc2026]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freebsd-build-test-vnet:
    name: 'FreeBSD 15.1 vnet shard ${{ matrix.shard }}/3'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test on FreeBSD 15.1 (shard)
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          mem: 4096
          cpu: 2
          run: |
            set -eu
            sh samples/freebsd-ci/freebsd-vmactions-build.sh
            echo "=== vnet conformance (iked<->iked ESP over pfkey KM), shard ${{ matrix.shard }}/3 ==="
            # FreeBSD /bin/sh has no pipefail, so tee would mask the matrix
            # exit status; capture to a file, cat the stream, then exit the
            # matrix's own code (the report job sums the per-shard logs).
            # The log goes in the synced workspace (CWD = checkout root), NOT
            # /tmp: vmactions syncs the workspace host<->VM bidirectionally
            # (same mechanism as the KAT logs) but /tmp is VM-local, so the
            # host-side upload step below could never see it.
            # The step MUST exit 0 even when the matrix is red: vmactions
            # only runs its reverse copyback rsync after a *successful* run
            # step, so a non-zero exit aborts the action before the log is
            # copied back to the host runner.  The report job is the gate
            # (it fails the run on any FAIL row) — same division of labor as
            # the Fedora/Ubuntu matrices, whose shard steps tee the log.
            rc=0
            ROW=all sh samples/freebsd-ci/freebsd-vnet-matrix.sh \
              --shard ${{ matrix.shard }} 3 \
              > r2-freebsd-matrix-shard-${{ matrix.shard }}.log 2>&1 || rc=$?
            cat r2-freebsd-matrix-shard-${{ matrix.shard }}.log
            [ "$rc" -eq 0 ] || echo "matrix rc=$rc (red rows; the merged report job gates the run)"
            exit 0

      - name: Upload shard matrix log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-matrix-shard-${{ matrix.shard }}
          path: r2-freebsd-matrix-shard-${{ matrix.shard }}.log
          overwrite: true
          if-no-files-found: error

      # A red row must fail THIS shard job directly, not only the merged
      # report job.  The vmactions run step above MUST exit 0 so the log is
      # rsynced back to the host runner; by the time we reach here the log
      # is in the synced workspace AND uploaded as an artifact (the upload
      # step is if: always(), so a later failure still preserves evidence).
      # The report job remains a belt-and-suspenders second gate.
      - name: Fail shard on red matrix rows
        if: always()
        run: |
          if grep -qE '^FAIL freebsd-vnet ' "r2-freebsd-matrix-shard-${{ matrix.shard }}.log"; then
            echo "::error::shard ${{ matrix.shard }} has FAIL freebsd-vnet rows (see r2-freebsd-matrix-shard-${{ matrix.shard }}.log)"
            grep -E '^FAIL freebsd-vnet ' "r2-freebsd-matrix-shard-${{ matrix.shard }}.log" || true
            exit 1
          fi
          echo "shard ${{ matrix.shard }}: no red rows"

      - name: 'Generate compliance report (KAT + matrix CPL evidence from FreeBSD 15.1 build)'
        if: matrix.shard == 0
        # The matrix log now carries per-row CPL A1-A14/B1-B6 cells (the
        # fbsd_comply emitter), so it joins the KAT files as evidence: the
        # SHARED ci-comply-report.sh dedups CPL/KAT lines and mk_report.sh
        # renders the same 20-cell report the Linux leg produces.
        run: |
          bash samples/linux-matrix/ci-comply-report.sh "$GITHUB_WORKSPACE/freebsd-build-test-151-compliance.md" \
            r2-freebsd-matrix-shard-0.log \
            iked/ndcppkats.log iked/test-suite.log lib/test-suite.log
        working-directory: ${{ runner.workspace }}/racoon2

      - name: 'Upload compliance report artifact'
        if: always() && matrix.shard == 0
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-freebsd-build-test-151
          path: freebsd-build-test-151-compliance.md
          overwrite: true
          # warn, not error: when the matrix has red rows the report
          # generation step is skipped (not always()), so the file may not
          # exist — that must not add a second unrelated red reason.
          if-no-files-found: warn

  freebsd-vnet-report:
    name: 'FreeBSD vnet merged report (all shards)'
    runs-on: ubuntu-latest
    needs: freebsd-build-test-vnet
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download shard matrix logs
        uses: actions/download-artifact@v4
        with:
          pattern: freebsd-matrix-shard-*
          path: /tmp/shards
          merge-multiple: true

      - name: Merge shard logs + gate on monitored FAIL
        run: |
          cat /tmp/shards/r2-freebsd-matrix-shard-*.log > /tmp/r2-freebsd-matrix.log
          PASS=$(grep -cE '^PASS freebsd-vnet ' /tmp/r2-freebsd-matrix.log || true)
          FAIL=$(grep -cE '^FAIL freebsd-vnet ' /tmp/r2-freebsd-matrix.log || true)
          echo "FREEBSD-VNET-PASS=$PASS"
          echo "FREEBSD-VNET-FAIL=$FAIL"
          grep -E '^FAIL freebsd-vnet ' /tmp/r2-freebsd-matrix.log || true
          # Shards ran disjoint row slices; merged counts must equal the
          # full 103-row matrix.  A matrix that aborted before any verdict
          # would otherwise merge to empty and PASS — gate on observed row
          # count AND zero FAIL.  (NO red rows are tolerated: the
          # expected-reject rows xcbc/cmac and the NEG rows pass on their
          # config markers, so any FAIL is a real conformance break.)
          TOTAL=$((PASS + FAIL))
          [ -s /tmp/r2-freebsd-matrix.log ] && [ "$TOTAL" -eq 103 ] && [ "$FAIL" -eq 0 ]

  # FreeBSD 16.0-CURRENT amd64 - the SAME build + 103-row vnet conformance,
  # but booted from the OFFICIAL project snapshot instead of the vmactions
  # 15.1 turnkey image.  vmactions/freebsd-vm has no 16.0 config yet (the
  # builder shelves 16.0), so this job self-hosts QEMU+KVM on the runner
  # (same mechanism vmactions uses internally) via freebsd-16-current-ci.sh:
  # download snapshot -> nuageinit seed (SSH key, disable firstboot pkg
  # upgrade) -> boot -> run freebsd-vmactions-build.sh + the matrix shard ->
  # copy the log back.  Every run boots the live "Latest" snapshot, like the
  # vmactions fresh-VM semantics.  root@runner, no locked-in guest state.
  #
  # Sharded exactly like the 15.1 vnet job: M=3 jobs, each its own VM, rows
  # whose dispatcher index % 3 == shard, disjoint slices; the merged report
  # job below sums them and gates the 103-row total.
  freebsd-16-current-vnet:
    name: 'FreeBSD 16.0-CURRENT vnet shard ${{ matrix.shard }}/3'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build + vnet matrix shard on FreeBSD 16.0-CURRENT (official snapshot, QEMU+KVM)
        run: bash samples/freebsd-ci/freebsd-16-current-ci.sh --shard ${{ matrix.shard }} 3

      - name: Upload 16.0-CURRENT shard matrix log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-16-current-matrix-shard-${{ matrix.shard }}
          path: freebsd-16-current-matrix-shard-${{ matrix.shard }}.log
          overwrite: true
          if-no-files-found: error

      - name: 'Generate compliance report (KAT + matrix CPL evidence from FreeBSD 16.0-CURRENT build)'
        # The script copies the three evidence logs back into the checkout
        # root; shard 0 renders the merged NDcPP report the same way the
        # 15.1 leg does (shard 0 only, so the artifact is not produced 3x).
        # The per-shard matrix log adds the fbsd_comply CPL cells (same
        # shared ci-comply-report.sh + mk_report.sh pipeline as Linux).
        if: matrix.shard == 0
        run: |
          bash samples/linux-matrix/ci-comply-report.sh "$GITHUB_WORKSPACE/freebsd-16-current-compliance.md" \
            freebsd-16-current-matrix-shard-0.log \
            iked/ndcppkats.log iked/test-suite.log lib/test-suite.log

      - name: 'Upload compliance report artifact'
        if: always() && matrix.shard == 0
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-freebsd-16-current
          path: freebsd-16-current-compliance.md
          overwrite: true
          # warn, not error: same rationale as the 15.1 report — when the
          # matrix is red the generation step may be skipped, and that must
          # not add a second unrelated red reason.
          if-no-files-found: warn

  freebsd-16-current-report:
    name: 'FreeBSD 16.0-CURRENT vnet merged report (all shards)'
    runs-on: ubuntu-latest
    needs: freebsd-16-current-vnet
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download 16.0-CURRENT shard matrix logs
        uses: actions/download-artifact@v4
        with:
          pattern: freebsd-16-current-matrix-shard-*
          path: /tmp/shards16
          merge-multiple: true

      - name: Merge 16.0-CURRENT shard logs + gate on monitored FAIL
        run: |
          cat /tmp/shards16/freebsd-16-current-matrix-shard-*.log > /tmp/r2-freebsd-16-current-matrix.log
          PASS=$(grep -cE '^PASS freebsd-vnet ' /tmp/r2-freebsd-16-current-matrix.log || true)
          FAIL=$(grep -cE '^FAIL freebsd-vnet ' /tmp/r2-freebsd-16-current-matrix.log || true)
          echo "FREEBSD-16-VNET-PASS=$PASS"
          echo "FREEBSD-16-VNET-FAIL=$FAIL"
          grep -E '^FAIL freebsd-vnet ' /tmp/r2-freebsd-16-current-matrix.log || true
          # Same semantics as the 15.1 report: disjoint shard slices, so the
          # merged count must equal the full 103-row matrix and there must be
          # zero FAIL (every FAIL is a real conformance break).
          TOTAL=$((PASS + FAIL))
          [ -s /tmp/r2-freebsd-16-current-matrix.log ] && [ "$TOTAL" -eq 103 ] && [ "$FAIL" -eq 0 ]
