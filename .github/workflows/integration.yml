# Reusable integration workflow: runs the linux-matrix live scenarios
# (samples/linux-matrix/run.sh) against an installed racoon2.
#
# Called from ubuntu.yml after the NETLINK_XFRM build succeeds. The pfkey
# Linux build is a compile sanity check only and never triggers this.
#
# inputs.dist selects which job:
#   - 'linux'  (default): Ubuntu host with systemd, runs the full matrix. The
#     PQC rows (gate=addke in cases.tsv) are SKIPPED because the OpenSSL 3.0
#     build has no ADDKE (run.sh's R2_ADDKE gate).  This is what the user asked
#     for: the PQC matrix does NOT run on Ubuntu.
#   - 'fedora': Fedora 44 container (OpenSSL 3.5), builds xfrm-addke
#     (--enable-addke, R2_ADDKE=yes) and runs the ADDKE-gated PQC case(s) plus
#     the systemd-free unit cases inline.  The PQC matrix RUNS here.
#
# A NetBSD integration run can reuse this workflow later via inputs.os; see
# netbsd.yml.

name: Integration (live matrix)

on:
  workflow_call:
    inputs:
      os:
        description: 'Target OS family for the integration run'
        required: false
        default: 'linux'
        type: string
      dist:
        description: 'linux (Ubuntu host, full matrix, PQC skipped) | fedora (Fedora 44 container, PQC matrix)'
        required: false
        default: 'linux'
        type: string
      cases:
        description: 'run.sh --cases regex (default: all case rows)'
        required: false
        default: ''
        type: string
    secrets:
      # future: token for pushing result artifacts; unused today
      none:
        required: false

permissions:
  contents: read

jobs:
  linux-matrix:
    name: 'Linux matrix shard ${{ matrix.shard }}/3 (${{ inputs.cases || ''all cases'' }})'
    runs-on: ubuntu-latest
    if: inputs.os == 'linux' && inputs.dist != 'fedora'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build + test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config gcc make \
            libssl-dev libkrb5-dev libpcap-dev bison flex strongswan iproute2 \
            libsystemd-dev iputils-ping xxd iptables

      - name: Build + install (xfrm backend)
        run: |
          sudo -E bash samples/linux-matrix/run.sh --src "$GITHUB_WORKSPACE" \
            --rebuild xfrm --cases 'a^'
        env:
          R2_PREFIX: /usr/local/racoon2

      - name: Stage live daemon config
        run: |
          sudo bash samples/linux-matrix/ci-setup.sh --prefix /usr/local/racoon2
          sudo systemctl status racoon2-iked racoon2-spmd --no-pager | head -12

      - name: Run the test matrix shard (xfrm backend)
        run: |
          CASES=${{ inputs.cases }}
          ARGS="--src $GITHUB_WORKSPACE --shard ${{ matrix.shard }} 3"
          [ -z "$CASES" ] || ARGS="$ARGS --cases $CASES"
          sudo -E bash samples/linux-matrix/run.sh $ARGS | tee /tmp/r2-matrix-shard-${{ matrix.shard }}.log
        env:
          R2_PREFIX: /usr/local/racoon2

      - name: Upload shard matrix log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-shard-${{ matrix.shard }}
          path: /tmp/r2-matrix-shard-${{ matrix.shard }}.log
          overwrite: true
          if-no-files-found: error

      - name: Collect integration diagnostics (on failure)
        if: failure()
        run: |
          sudo bash -c '
          set -x
          ls -la /run/iked.sock /run/racoon2 2>&1
          systemctl status iked spmd --no-pager 2>&1 | head -30
          journalctl -u iked -u spmd -n 40 --no-pager 2>&1 | tail -45
          ss -ulnp 2>&1 | head -20
          head -30 /tmp/r2-iked-matrix.log 2>&1
          id && ls -la /usr/local/racoon2/etc/racoon2 2>&1 | head -8
          ' > /tmp/r2-diag.txt 2>&1 || true
          cat /tmp/r2-diag.txt | tail -80

      - name: Upload matrix logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-logs-${{ matrix.shard }}
          path: |
            /tmp/r2-iked-matrix.log
            /tmp/r2-diag.txt
            /tmp/*.log
            /tmp/r2_*.txt
          if-no-files-found: warn

  linux-matrix-report:
    name: 'Linux compliance report (merged shards)'
    runs-on: ubuntu-latest
    needs: linux-matrix
    if: inputs.os == 'linux' && inputs.dist != 'fedora'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download shard matrix logs
        uses: actions/download-artifact@v4
        with:
          pattern: matrix-shard-*
          path: /tmp/shards
          merge-multiple: true

      - name: Merge shard logs + generate compliance report
        run: |
          cat /tmp/shards/r2-matrix-shard-0.log \
              /tmp/shards/r2-matrix-shard-1.log \
              /tmp/shards/r2-matrix-shard-2.log > /tmp/r2-matrix.log
          bash samples/linux-matrix/ci-comply-report.sh "$GITHUB_WORKSPACE/linux-matrix-compliance.md" /tmp/r2-matrix.log

      - name: Upload compliance report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-linux-matrix
          path: linux-matrix-compliance.md
          overwrite: true
          if-no-files-found: error

  fedora-pqc-matrix:
    name: 'Fedora PQC matrix shard ${{ matrix.shard }}/3 (ADDKE, gated to Fedora)'
    runs-on: ubuntu-latest
    # netns/xfrm in the matrix (ip netns add, ip xfrm policy, and the
    # i2ike bringup `mount --make-shared /var/run/netns`) need full mount +
    # netlink capability.  cap-add=NET_ADMIN/SYS_ADMIN alone is not enough:
    # GH container jobs still deny the --make-shared remount propagation.
    # --privileged lifts it so the PQC matrix can set up the veth netns.
    container:
      image: fedora:44
      options: --privileged
    if: inputs.dist == 'fedora'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - name: Install deps (dnf, incl. git for checkout)
        run: |
          dnf install -y -q \
            autoconf automake libtool pkgconf-pkg-config gcc make \
            openssl openssl-devel libpcap-devel krb5-devel bison flex git \
            iproute iproute-tc strongswan procps-ng

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify OpenSSL 3.5 (ML-KEM available -> ADDKE build)
        run: |
          openssl version
          pkg-config --modversion openssl
          test -f /usr/include/openssl/ml_kem.h && echo "ml_kem.h present (ADDKE buildable)" \
            || { echo "WARNING: no /usr/include/openssl/ml_kem.h"; }

      - name: Probe charon ML-KEM (gate for any future charon PQC row)
        run: |
          CHARON=$(ls /usr/libexec/strongswan/charon /usr/lib/ipsec/charon 2>/dev/null | head -1)
          if [ -z "$CHARON" ]; then
            echo "PROBE: no charon binary found; SKIP any charon PQC row"
            exit 0
          fi
          if strings "$CHARON" | grep -q mlkem768 \
              || strings /usr/lib64/strongswan/libstrongswan.so.0 /usr/lib/strongswan/libstrongswan.so 2>/dev/null | grep -q mlkem768 \
              || find /usr/lib64/strongswan /usr/lib/strongswan -name 'libstrongswan-ml.so' 2>/dev/null | grep -q .; then
            echo "PROBE: ML-KEM present (charon or the ml plugin/library) -> charon PQC row is legal"
          else
            echo "PROBE: no ML-KEM (binary is a ~19 KB loader; the strings live in libstrongswan.so.0 / the ml plugin — doc/int-gsoc2026.md) -> SKIP any charon PQC row; iked<->iked i2i rows remain the PQC gate"
          fi

      - name: Build + install (xfrm + --enable-addke)
        run: |
          export R2_ADDKE=yes R2_PREFIX=/usr/local/racoon2
          bash samples/linux-matrix/run.sh --src "$GITHUB_WORKSPACE" \
            --rebuild xfrm-addke --cases 'a^'
        env:
          R2_PREFIX: /usr/local/racoon2

      - name: Stage test secrets/config (container has no systemd units)
        run: |
          E="$R2_PREFIX/etc/racoon2"
          mkdir -p "$E/psk"
          printf 'racoon2-ci-psk-0123456789abcdef' > "$E/psk/macos.psk"
          printf 'racoon2-ci-pwd\n' > "$E/spmd.pwd"
          chmod 600 "$E/psk/macos.psk" "$E/spmd.pwd"
          ls -la "$E" | head -8
        env:
          R2_PREFIX: /usr/local/racoon2

      - name: Run the PQC matrix (ADDKE i2ike)
        run: |
          export R2_ADDKE=yes
          # charon interop rows (-charon: charon initiator, -charonr: charon
          # responder) use Fedora's strongSwan 6.0.x package (ML-KEM through
          # the openssl plugin on OpenSSL 3.5).  Resolve swanctl wherever
          # the package put it instead of assuming the bin/sbin merge.
          export I2I_SWANCTL_BIN=$(command -v swanctl || echo /usr/sbin/swanctl)
          "$I2I_SWANCTL_BIN" --version || true
          CASES=${{ inputs.cases }}
          # run.sh's filter regex-matches case NAMES; 'i2ike' would also pull
          # in i2ikesa-addke (and 'i2ikesa-addke' is a separate ADDKE gate).
          # Cover the box-verified gate rows on the INITIAL + rekey paths,
          # plus the counted-drop replay kill-tests (i2ike-drop R2 replay,
          # i2iinit-drop576 H1 fragment replay).  i2ike-drop576 is not in
          # this list until a container run passes its counted gate.
          # Names are anchored: a bare i2ike-drop also matches i2ike-drop576.
          # i2ike-drop576 is box-green once and container-red (36204006963:
          # new Y never landed).  It stays out of this default until a
          # container run passes the same counted gate.
          [ -n "$CASES" ] || CASES='^(i2iv6-esp |i2iv6-esp-cbc128 |i2iinit-addke |i2iinit-nointermediate |i2iinit-childless |i2iinit-childless-init |i2iinit-childless-init-rsa |i2iinit-childless-init-cfg |i2iinit-childless-init-cfgneg |i2iinit-pfsrekey |i2iinit-pfsrekey-dh384 |i2iinit-pfsrekey-dh521 |i2iinit-ike-gcm256 |i2iinit-prfxcbc |i2iinit-prfcmac |i2iinit-esp-cbc128 |i2iinit-esp-cbc192 |i2iinit-esp-sha384 |i2iinit-esp-sha512 |i2iinit-esp-xcbc |i2iinit-esp-cmac |i2iinit-esp-ctr |i2idh-modp2048 |i2idh-modp3072 |i2idh-modp4096 |i2idh-modp6144 |i2idh-modp8192 |i2idh-ecp256 |i2idh-ecp384 |i2idh-ecp521 |i2ike-addke |i2ikesa-addke |i2ike-drop |i2iinit-drop576 |i2ike-addke-immediate |i2iinit-immediate |i2iinit-immediate-r |i2iinit-firstchild |i2iinit-firstchild-nocl |i2iinit-clresp |i2iinit-clresp-legacy |i2iinit-gens |i2iinit-ikerekey |i2iinit-noacq |i2iinit-charon |i2iinit-charonr |i2iinit-childless-charon |i2iinit-immediate-charon |i2iinit-immediate-charonr |i2iinit-firstchild-charonr |i2iinit-firstchild-nocl-charonr |i2iinit-clresp-charon |i2iinit-clresp-legacy-charon |i2iinit-gens-charon |i2iinit-gens-charonr |i2iinit-gens-cr-charon |i2iinit-gens-cr-charonr |i2iinit-ikerekey-charon |i2iinit-ikerekey-charonr |i2iinit-ikerekey-cr-charon |i2iinit-ikerekey-cr-charonr |i2iinit-zerochild-charon |i2iinit-zerochild-cr-charon )'
          # run.sh splits ARGS on IFS.  A --cases value with spaces (the
          # anchored names above) must be one argv: pass it quoted.
          # --shard partitions the filter-passing rows round-robin; each of
          # the 3 matrix shards is its own container, so the netns/socket
          # names per kind never collide across shards.
          bash samples/linux-matrix/run.sh --src "$GITHUB_WORKSPACE" \
            --shard ${{ matrix.shard }} 3 --cases "$CASES" | tee /tmp/r2-matrix-shard-${{ matrix.shard }}.log
        env:
          R2_PREFIX: /usr/local/racoon2

      - name: Upload shard matrix log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedora-pqc-matrix-shard-${{ matrix.shard }}
          path: /tmp/r2-matrix-shard-${{ matrix.shard }}.log
          overwrite: true
          if-no-files-found: error

      - name: Upload matrix logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fedora-pqc-matrix-logs
          path: |
            /tmp/r2-*/*.log
            /tmp/*.log
          if-no-files-found: warn

  fedora-pqc-report:
    name: 'Fedora PQC compliance report (merged shards)'
    runs-on: ubuntu-latest
    needs: fedora-pqc-matrix
    if: inputs.dist == 'fedora'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download shard matrix logs
        uses: actions/download-artifact@v4
        with:
          pattern: fedora-pqc-matrix-shard-*
          path: /tmp/shards
          merge-multiple: true

      - name: Merge shard logs + generate compliance report
        run: |
          cat /tmp/shards/r2-matrix-shard-0.log \
              /tmp/shards/r2-matrix-shard-1.log \
              /tmp/shards/r2-matrix-shard-2.log > /tmp/r2-matrix.log
          bash samples/linux-matrix/ci-comply-report.sh "$GITHUB_WORKSPACE/fedora-pqc-compliance.md" /tmp/r2-matrix.log /tmp/r2-*/*.log /tmp/*.log

      - name: Upload compliance report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-fedora-pqc
          path: fedora-pqc-compliance.md
          overwrite: true
          if-no-files-found: error
