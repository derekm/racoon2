# Minimal self-contained config for lib/sample (no ${} vars).
# The live daemon configs reference vals.conf; sample parses one file.

remote sample_remote {
	acceptable_kmp { ikev2; };
	ikev2 {
		passive on;
		my_id fqdn "sample.local";
		peers_id fqdn "peers.sv.test";
		kmp_enc_alg { aes256_cbc; aes128_cbc; };
		kmp_hash_alg { hmac_sha2_256; };
		kmp_dh_group { modp2048; };
		kmp_auth_method { psk; };
		pre_shared_key "/etc/secrets/sample.psk";
		provide {
			addresspool sample_pool;
		};
	};
};

addresspool sample_pool {
	"192.0.2.10" - "192.0.2.250";
};
