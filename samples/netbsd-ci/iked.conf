# Self-contained NetBSD rc.d smoke config. No ${} macros, no includes.
# Binds IKE on loopback only. Not a tunnel interop fixture.
interface {
	ike {
		127.0.0.1 port 500;
	};
	spmd {
		unix "/var/run/racoon2/spmif";
	};
	spmd_password "/usr/local/racoon2/etc/racoon2/spmd.pwd";
};
resolver {
	resolver off;
};
default {
	remote {
		acceptable_kmp { ikev2; };
		ikev2 {
			kmp_enc_alg { aes128_cbc; };
			kmp_prf_alg { hmac_sha2_256; };
			kmp_hash_alg { hmac_sha2_256; };
			kmp_dh_group { modp2048; };
			kmp_auth_method { psk; };
		};
	};
};
