# Strict CNSSP-15 / CNSA baseline IKEv2 configuration.
#
# NSA "Securing IPsec Virtual Private Networks" + "Configuring IPsec
# Virtual Private Networks" (June 2020) compliant example:
#   IKE:  DH group 16 (or 20/15) - AES-256 - SHA-384
#   ESP:  AES-256 - SHA-384 - CBC (or an AEAD such as AES-GCM per NIST)
#   Remove/DETECT: DES, 3DES, MD5, SHA-1, DH groups 1/2/5.
#
# This is the copy-from baseline for a new deployment.  Lifetime values
# are site policy (NDcPP v3.0e A7/A8 requires administratively
# configurable lifetimes, which they are).  No legacy algorithm is
# offered, so no proposal can downgrade below the CNSA baseline.
# See doc/nsa-ipsec-hardening.md.
#
# ${...} macros are vals.conf substitutions; replace with literal
# addresses or provide a vals.conf.  The ML-KEM hybrid (esp_addke_alg /
# addke_unrequested) requires OpenSSL >= 3.5 and --enable-addke; it is
# shown commented because the baseline is a pure classical CNSA set.

remote nsa_fips_peer {
	acceptable_kmp { ikev2; };
	ikev2 {
		my_id fqdn "${MY_FQDN}";
		peers_id fqdn "${PEERS_FQDN}";
		peers_ipaddr "${PEERS_GWADDRESS}" port 500;
		kmp_enc_alg  { aes256_cbc; };          # AES-256, not 3DES/DES
		kmp_prf_alg  { hmac_sha2_384; hmac_sha2_256; };
		kmp_hash_alg { hmac_sha2_384; };       # SHA-384, not SHA-1/MD5
		kmp_dh_group { modp4096; modp3072; };  # groups 16, 15 - not 1/2/5
		kmp_auth_method { psk; };
		pre_shared_key "${PSKDIR}/${PRESHRD_KEY}";
		# auth_method is psk here for a two-role lab; for peer-bound
		# deployments prefer certificate AUTH and keep
		# verify_id/verify_pubkey on.
	};
	selector_index nsa_sel_in;
};

selector nsa_sel_out {
	direction outbound;
	src "${MY_NET}";
	dst "${PEERS_NET}";
	policy_index nsa_policy;
};

selector nsa_sel_in {
	direction inbound;
	dst "${MY_NET}";
	src "${PEERS_NET}";
	policy_index nsa_policy;
};

policy nsa_policy {
	action auto_ipsec;
	remote_index nsa_fips_peer;
	ipsec_mode tunnel;
	ipsec_index { ipsec_nsa_esp; };
	ipsec_level require;
	peers_sa_ipaddr "${PEERS_GWADDRESS}";
	my_sa_ipaddr "${MY_GWADDRESS}";
};

ipsec ipsec_nsa_esp {
	ipsec_sa_lifetime_time 3600 sec;
	sa_index esp_nsa;
};

sa esp_nsa {
	sa_protocol esp;
	esp_enc_alg  { aes256_cbc; };
	esp_auth_alg { hmac_sha2_384; hmac_sha2_256; };
	# PQC hybrid (requires --enable-addke):
	# esp_addke_alg { mlkem768; };
};

