# Road-warrior IKEv2 gateway: pre-shared key
# Copy to /usr/local/racoon2/etc/racoon2/racoon2.conf (or include it from
# there), edit the lines marked EDIT, then check it with:
#     iked -C -f /usr/local/racoon2/etc/racoon2/racoon2.conf
# Every value here is a documentation placeholder (RFC 5737 192.0.2.1,
# example.net names). See samples/roadwarrior/README.md for the client side.

interface {
	ike { "192.0.2.1" port 500; "192.0.2.1" port 4500; };	# EDIT: public address
	spmd { unix "/var/run/racoon2/spmif"; };
	spmd_password "/usr/local/racoon2/etc/racoon2/spmd.pwd";
};
resolver { resolver off; };

remote rw {
	acceptable_kmp { ikev2; };
	ikev2 {
		passive on;
		my_id fqdn "vpn.example.net";		# EDIT: client's "Remote ID"
		peers_id fqdn "client.example.net";	# EDIT: client's "Local ID"
		peers_ipaddr IP_RW;
		kmp_enc_alg { aes_gcm; aes256_cbc; };
		kmp_prf_alg { hmac_sha2_256; };
		kmp_hash_alg { hmac_sha2_256; };
		kmp_dh_group { ecp256; modp2048; };
		kmp_auth_method { psk; };
		# one line, mode 0600; generate with: pskgen -r -o <file>
		pre_shared_key "/usr/local/racoon2/etc/racoon2/psk/rw.psk";
		kmp_sa_lifetime_time 28800 sec;
		provide { addresspool rw_pool; };
	};
	selector_index rw_sel_in;
};

# Clients get an inner address from this pool (IKEv2 configuration payload).
addresspool rw_pool {
	"10.99.0.10" - "10.99.0.250";
};

# The protected network behind the gateway <-> any client inner address.
selector rw_sel_out {
	direction outbound;
	src "10.10.0.0/16";
	dst "0.0.0.0/0";
	policy_index rw_policy;
};
selector rw_sel_in {
	direction inbound;
	dst "10.10.0.0/16";
	src "0.0.0.0/0";
	policy_index rw_policy;
};

policy rw_policy {
	action auto_ipsec;
	remote_index rw;
	ipsec_mode tunnel;
	ipsec_index { ipsec_rw; };
	ipsec_level require;
	peers_sa_ipaddr IP_RW;		# whatever address the client comes from
	my_sa_ipaddr "192.0.2.1";	# EDIT: the gateway's public address
};

ipsec ipsec_rw {
	ipsec_sa_lifetime_time 3600 sec;
	sa_index esp_rw;
};

sa esp_rw {
	sa_protocol esp;
	esp_enc_alg { aes_gcm; aes256_cbc; };
	esp_auth_alg { non_auth; hmac_sha2_256; };
};
