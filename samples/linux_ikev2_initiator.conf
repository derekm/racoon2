# IKEv2 PSK initiator (Linux netns client) for the macos_rw responder.
# my_id = macos.client, peers_id = racoon2.wsl, same PSK.
remote linux_init {
	acceptable_kmp { ikev2; };
	ikev2 {
		my_id fqdn "${MY_FQDN}";
		peers_id fqdn "${PEERS_FQDN}";
		peers_ipaddr "${PEERS_GWADDRESS}" port 500;
		kmp_enc_alg { aes256_cbc; aes128_cbc; };
		kmp_prf_alg { hmac_sha2_256; };
		kmp_hash_alg { hmac_sha2_256; };
		kmp_dh_group { modp2048; modp3072; };
		kmp_auth_method { psk; };
		pre_shared_key "${PSKDIR}/${PRESHRD_KEY}";
	};
	selector_index linux_sel_in;
};

selector linux_sel_out {
	direction outbound;
	src "${MY_NET}";
	dst "${PEERS_NET}";
	policy_index linux_policy;
};

selector linux_sel_in {
	direction inbound;
	dst "${MY_NET}";
	src "${PEERS_NET}";
	policy_index linux_policy;
};

policy linux_policy {
	action auto_ipsec;
	remote_index linux_init;
	ipsec_mode tunnel;
	ipsec_index { ipsec_esp_gcm; ipsec_esp_sha2; };
	ipsec_level require;
	peers_sa_ipaddr "${PEERS_GWADDRESS}";
	my_sa_ipaddr "${MY_GWADDRESS}";
};

ipsec ipsec_esp_gcm {
	ipsec_sa_lifetime_time 3600 sec;
	sa_index esp_gcm;
};

ipsec ipsec_esp_sha2 {
	ipsec_sa_lifetime_time 3600 sec;
	sa_index esp_sha2;
};

sa esp_gcm {
	sa_protocol esp;
	esp_enc_alg { aes_gcm; };
	esp_auth_alg { non_auth; };
};

sa esp_sha2 {
	sa_protocol esp;
	esp_enc_alg { aes256_cbc; aes128_cbc; };
	esp_auth_alg { hmac_sha2_256; };
};
