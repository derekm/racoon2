# IKEv2 PSK tunnel for macOS 26/27 (road warrior). Responder.
# Client steps: doc/macos-26-27-ikev2-client.md
# Remote ID = MY_FQDN, Local ID = PEERS_FQDN, Machine Auth = Shared Secret.
# IKE SA is AES-CBC (no aes_gcm in kmp_enc_alg). ESP prefers AES-GCM-16.
remote macos_rw {
	acceptable_kmp { ikev2; };
	ikev2 {
		passive on;
		my_id fqdn "${MY_FQDN}";
		peers_id fqdn "${PEERS_FQDN}";
		peers_ipaddr IP_RW;
		kmp_enc_alg { aes256_cbc; aes128_cbc; };
		kmp_prf_alg { hmac_sha2_256; };
		kmp_hash_alg { hmac_sha2_256; };
		kmp_dh_group { modp2048; modp3072; };
		kmp_auth_method { psk; };
		pre_shared_key "${PSKDIR}/${PRESHRD_KEY}";
		provide {
			addresspool macos_pool;
		};
	};
	selector_index macos_sel_in;
};

# IKEv2 CP pool — Apple clients always request an internal address.
addresspool macos_pool {
	"${CP_ADDRPL4_START}" - "${CP_ADDRPL4_END}";
};

selector macos_sel_out {
	direction outbound;
	src "${MY_NET}";
	dst "${PEERS_NET}";
	policy_index macos_policy;
};

selector macos_sel_in {
	direction inbound;
	dst "${MY_NET}";
	src "${PEERS_NET}";
	policy_index macos_policy;
};

policy macos_policy {
	action auto_ipsec;
	remote_index macos_rw;
	ipsec_mode tunnel;
	ipsec_index { ipsec_esp_gcm; ipsec_esp_sha2; };
	ipsec_level require;
	peers_sa_ipaddr IP_RW;
	my_sa_ipaddr "${MY_GWADDRESS}";
};

ipsec ipsec_esp_gcm {
	ipsec_sa_lifetime_time 3600 sec;
	sa_index esp_gcm;
};

ipsec ipsec_esp_sha2 {
	ipsec_sa_lifetime_time 3600 sec;
	sa_index esp_sha2;
};

sa esp_gcm {
	sa_protocol esp;
	esp_enc_alg { aes_gcm; };
	esp_auth_alg { non_auth; };
};

sa esp_sha2 {
	sa_protocol esp;
	esp_enc_alg { aes256_cbc; aes128_cbc; };
	esp_auth_alg { hmac_sha2_256; hmac_sha2_384; hmac_sha2_512; };
};
