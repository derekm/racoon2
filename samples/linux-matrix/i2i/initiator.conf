# iked<->iked netns INITIATOR (netns, CIP=192.0.2.2), root-only matrix tile.
# fqdn IDs matching the responder's macos_rw-style remote.  passive (initiator);
# `-I 192.0.2.1`/ikedctl establish-sa starts the exchange.  sa carries
# esp_addke_alg so the initiator offers type-6 ADDKE.
interface {
	ike { "192.0.2.2"; };
	spmd { unix "/tmp/spmif-i2i"; };
	spmd_password "/usr/local/racoon2/etc/racoon2/spmd.pwd";
};
resolver { resolver off; };

remote i2i_init {
	acceptable_kmp { ikev2; };
	ikev2 {
		my_id fqdn "macos.client";
		peers_id fqdn "racoon2.wsl";
		peers_ipaddr "192.0.2.1" port 500;
		kmp_enc_alg { aes256_cbc; aes128_cbc; };
		kmp_prf_alg { hmac_sha2_256; };
		kmp_hash_alg { hmac_sha2_256; };
		kmp_dh_group { ecp256; modp2048; modp3072; };
		kmp_auth_method { psk; };
		pre_shared_key "/usr/local/racoon2/etc/racoon2/psk/macos.psk";
	};
	selector_index sel_in;
};

selector sel_out {
	direction outbound;
	src "192.0.2.2";
	dst "192.0.2.1";
	policy_index pol;
};
selector sel_in {
	direction inbound;
	dst "192.0.2.2";
	src "192.0.2.1";
	policy_index pol;
};

policy pol {
	action auto_ipsec;
	remote_index i2i_init;
	ipsec_mode tunnel;
	ipsec_index { ipsec_e; };
	ipsec_level require;
	peers_sa_ipaddr "192.0.2.1";
	my_sa_ipaddr "192.0.2.2";
};

ipsec ipsec_e {
	ipsec_sa_lifetime_time 60 sec;
	sa_index esp_e;
};

sa esp_e {
	sa_protocol esp;
	esp_enc_alg { aes_gcm; };
	esp_auth_alg { non_auth; };
	esp_addke_alg { mlkem768; };
};
