# iked<->iked netns RESPONDER (host ns, RIP=192.0.2.1), root-only matrix tile.
# Passive remote for the initiator (peers_id fqdn macos.client).  sa carries
# esp_addke_alg so the responder's child proposal offers type-6 on rekey.
interface {
	ike { "192.0.2.1"; };
	spmd { unix "/tmp/spmif-r2i2"; };
	spmd_password "/usr/local/racoon2/etc/racoon2/spmd.pwd";
};
resolver { resolver off; };

remote i2i_resp {
	acceptable_kmp { ikev2; };
	ikev2 {
		passive on;
		my_id fqdn "racoon2.wsl";
		peers_id fqdn "macos.client";
		peers_ipaddr "192.0.2.2";
		kmp_enc_alg { aes256_cbc; aes128_cbc; };
		kmp_prf_alg { hmac_sha2_256; };
		kmp_hash_alg { hmac_sha2_256; };
		kmp_dh_group { ecp256; modp2048; modp3072; };
		kmp_auth_method { psk; };
		pre_shared_key "/usr/local/racoon2/etc/racoon2/psk/macos.psk";
		dpd_delay 60 sec;
	};
	selector_index sel_in;
};

selector sel_out {
	direction outbound;
	src "192.0.2.1";
	dst "192.0.2.2";
	policy_index pol;
};
selector sel_in {
	direction inbound;
	dst "192.0.2.1";
	src "192.0.2.2";
	policy_index pol;
};

policy pol {
	action auto_ipsec;
	remote_index i2i_resp;
	ipsec_mode tunnel;
	ipsec_index { ipsec_e; };
	ipsec_level require;
	peers_sa_ipaddr "192.0.2.2";
	my_sa_ipaddr "192.0.2.1";
};

ipsec ipsec_e {
	ipsec_sa_lifetime_time 60 sec;
	sa_index esp_e;
};

sa esp_e {
	sa_protocol esp;
	esp_enc_alg { aes_gcm; };
	esp_auth_alg { non_auth; };
	esp_addke_alg { mlkem768; };
};
