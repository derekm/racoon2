# IKEv1 PSK responder (NAT-T) for the Linux client behind iptables NAT.
# Tests the IKEv1 natt_type path: client behind MASQUERADE trips
# NAT_DETECTED, IKE floats to 4500, ESP installs with XFRMA_ENCAP.
# Live copy uses literal IPs for the test topology; the ${} vars are
# the same values as the IKEv2 road-warrior samples.
remote ik1_nat_remote {
	acceptable_kmp { ikev1; };
	ikev1 {
		my_id ipaddr "${MY_GWADDRESS}";
		peers_ipaddr "IP_ANY";
		kmp_enc_alg { aes256_cbc; aes128_cbc; 3des_cbc; };
		kmp_hash_alg { sha1; };
		kmp_dh_group { modp2048; modp1024; };
		kmp_auth_method { psk; };
		pre_shared_key "${PSKDIR}/${PRESHRD_KEY}";
	};
	selector_index ik1_sel_in;
};

selector ik1_sel_out {
	direction outbound;
	src "${MY_NET}";
	dst "${PEERS_NET}";
	policy_index ik1_policy;
};

selector ik1_sel_in {
	direction inbound;
	dst "${MY_NET}";
	src "${PEERS_NET}";
	policy_index ik1_policy;
};

policy ik1_policy {
	action auto_ipsec;
	remote_index ik1_nat_remote;
	ipsec_mode tunnel;
	ipsec_index { ipsec_esp_sha1; };
	ipsec_level require;
	peers_sa_ipaddr "IP_ANY";
	my_sa_ipaddr "${MY_GWADDRESS}";
};

ipsec ipsec_esp_sha1 {
	ipsec_sa_lifetime_time 3600 sec;
	sa_index esp_sha1;
};

sa esp_sha1 {
	sa_protocol esp;
	esp_enc_alg { aes256_cbc; aes128_cbc; };
	esp_auth_alg { hmac_sha1; };
};
